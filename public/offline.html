<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f855a">
<title>Sin conexión · EcoPuntos</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #1f2a1f; background: #fff; }
  main { max-width: 22rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: .75rem 0 .5rem; }
  p { color: #5b6b5b; line-height: 1.5; }
  button { margin-top: 1rem; min-height: 48px; width: 100%; border: 0; border-radius: .75rem; background: #2f855a; color: #fff; font-size: 1rem; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="72" height="72">
  <h1>Sin conexión</h1>
  <p>EcoPuntos necesita internet para mostrar tu saldo y canjear tickets. Revisa tu conexión e intenta de nuevo.</p>
  <button type="button" onclick="location.reload()">Intentar de nuevo</button>
</main>
</body>
</html>
